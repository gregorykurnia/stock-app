name: Capture portfolio snapshot

on:
  schedule:
    # Recover missed sessions across midnight and after weekends as well.
    - cron: "17,47 0-12,20-23 * * *"
  workflow_dispatch: {}

concurrency:
  group: portfolio-snapshot-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call portfolio snapshot endpoint
        run: |
          curl --fail-with-body --show-error --silent --max-time 310 \
            --retry 2 --retry-all-errors --retry-delay 20 \
            "https://stock-app-five-sable.vercel.app/api/cron/portfolio-snapshot" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" > response.json
          cat response.json
          jq -e '.healthy == true and (.pendingSessionDates | length == 0)' response.json
